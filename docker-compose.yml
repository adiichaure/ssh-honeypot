services:
  honeypot:
    build: .
    ports:
      - "2222:2222"
    volumes:
      - honeypot-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 200
    restart: unless-stopped

volumes:
  honeypot-data:
